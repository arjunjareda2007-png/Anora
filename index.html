    <script>
      const isDev = window.location.hostname === 'localhost' || window.location.hostname.includes('ais-dev-');
      if (isDev && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function(unregistered) {
              if (unregistered) console.log('[Anora PWA] Cleared dev ServiceWorker');
            });
          }
        });
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) { caches.delete(key); });
          });
        }
      } else if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[Anora PWA] ServiceWorker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.warn('[Anora PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
